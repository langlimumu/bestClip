name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\BestClip.exe package\
          Copy-Item dist\BestClip.exe.config package\
          Copy-Item 使用说明.txt package\
          Compress-Archive -Path package\* -DestinationPath BestClip-portable.zip -Force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME BestClip-portable.zip `
            --title "BestClip $env:GITHUB_REF_NAME" `
            --generate-notes
